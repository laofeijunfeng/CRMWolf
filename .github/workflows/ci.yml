name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ===== 前端 Lint 检查 =====
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'CRM-Client/package-lock.json'

      - name: Install dependencies
        run: cd CRM-Client && npm ci

      - name: Run ESLint
        run: cd CRM-Client && npm run lint

      - name: Run TypeScript check
        run: cd CRM-Client && npm run type-check

      - name: Run design-system governance tests
        run: cd CRM-Client && npm run test:governance

      - name: Audit design-system migration baseline
        run: cd CRM-Client && npm run lint:design-system:all

  # ===== 前端测试 =====
  frontend-test:
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: cd CRM-Client && npm ci

      - name: Run unit tests
        run: cd CRM-Client && npm run test:unit -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: CRM-Client/coverage
          flags: frontend

  # ===== 后端 Lint 检查 =====
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd CRM-Server
          pip install --require-hashes -r requirements.lock -r requirements-dev.lock
          python -m scripts.verify_agent_dependency_baseline --include-dev
          python -m scripts.generate_agent_contract_schemas --check

      - name: Run Ruff
        run: cd CRM-Server && ruff check app/

      - name: Run MyPy
        run: cd CRM-Server && mypy app/ --ignore-missing-imports

  # ===== 后端测试 =====
  backend-test:
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: crm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd CRM-Server
          pip install --require-hashes -r requirements.lock -r requirements-dev.lock
          python -m scripts.verify_agent_dependency_baseline --include-dev

      - name: Run unit tests
        run: cd CRM-Server && python -m pytest tests/unit -v --cov=app --cov-report=xml
        env:
          DATABASE_URL: mysql+pymysql://root:test@localhost:3306/crm_test
          REDIS_URL: redis://localhost:6379

      - name: Run CRM Agent golden eval
        run: cd CRM-Server && python -m scripts.run_customer_context_answer_eval
        env:
          DATABASE_URL: mysql+pymysql://root:test@localhost:3306/crm_test
          REDIS_URL: redis://localhost:6379

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: CRM-Server/coverage.xml
          flags: backend

  # ===== 合规检查 =====
  compliance-check:
    runs-on: ubuntu-latest
    needs: [frontend-lint, backend-lint]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve complete change range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/resolve-change-range.sh

      - name: Check TypeScript violations
        run: |
          set -euo pipefail
          added_lines="$(
            git diff --unified=0 "$DIFF_RANGE" -- 'CRM-Client/**/*.ts' 'CRM-Client/**/*.tsx' 'CRM-Client/**/*.vue' \
              | sed -n '/^+++ /d; s/^+//p'
          )"

          if printf '%s\n' "$added_lines" | grep -Eq ':[[:space:]]*any([[:space:];,)=]|$)'; then
            echo "::error::Found added TypeScript ': any' violations in the full change range"
            exit 1
          fi

          if printf '%s\n' "$added_lines" | grep -Eq '(^|[^[:alnum:]_])as[[:space:]]+any([^[:alnum:]_]|$)'; then
            echo "::error::Found added TypeScript 'as any' violations in the full change range"
            exit 1
          fi

          echo "✅ No added TypeScript any violations in $DIFF_RANGE"

      - name: Check config lock
        run: |
          # 受锁配置发生变化时，完整变更范围内必须追加永久审批记录
          changed_files=$(git diff "$DIFF_RANGE" --name-only)
          if echo "$changed_files" | grep -qE "(^|/)(tsconfig.json|eslint.config.js|pyproject.toml)$"; then
            if ! echo "$changed_files" | grep -qx "CRM-Docs/development/config-change-approvals.md"; then
              echo "::error::Config file modified without approval record"
              echo "Append an approved entry to CRM-Docs/development/config-change-approvals.md in the same change"
              exit 1
            fi
            echo "✅ Config change includes CRM-Docs/development/config-change-approvals.md approval record"
          else
            echo "✅ Protected config files not modified"
          fi

      - name: Generate compliance report
        run: |
          echo "## Compliance Report" > compliance-report.md
          echo "" >> compliance-report.md
          echo "### TypeScript Violations" >> compliance-report.md
          cd CRM-Client
          echo "- : any count: $(grep -r ": any" src --include="*.ts" --include="*.vue" 2>/dev/null | wc -l)" >> ../compliance-report.md
          echo "- as any count: $(grep -r "as any" src --include="*.ts" --include="*.vue" 2>/dev/null | wc -l)" >> ../compliance-report.md
          cd ..

          cat compliance-report.md

  # ===== 文档同步检查 =====
  doc-sync-check:
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve complete change range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/resolve-change-range.sh

      - name: Check API doc sync
        run: |
          # 检查 API 文件变更是否同步更新文档
          api_changed=$(git diff "$DIFF_RANGE" --name-only | grep -c "CRM-Client/src/api/" || true)
          doc_changed=$(git diff "$DIFF_RANGE" --name-only | grep -c "CRM-Docs/05-API接口.md" || true)

          if [ "$api_changed" -gt 0 ] && [ "$doc_changed" -eq 0 ]; then
            echo "::warning::API files changed but API documentation not updated"
          fi

      - name: Check TypeScript doc sync
        run: |
          # 检查类型变更是否同步更新文档
          type_changed=$(git diff "$DIFF_RANGE" --name-only | grep -c "CRM-Client/src/schemas/" || true)
          typescript_doc_changed=$(git diff "$DIFF_RANGE" --name-only | grep -c "CRM-Client/docs/TYPESCRIPT.md" || true)

          if [ "$type_changed" -gt 0 ] && [ "$typescript_doc_changed" -eq 0 ]; then
            echo "::warning::Schema files changed but TYPESCRIPT.md not updated"
          fi

  # ===== 设计系统文档检查 =====
  design-system-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Test design-system documentation checker
        run: node CRM-Docs/scripts/tests/check-design-system-docs.test.js
      - name: Check design-system documentation
        run: node CRM-Docs/scripts/check-design-system-docs.js
