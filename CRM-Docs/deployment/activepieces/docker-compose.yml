# CRMWolf Activepieces MVP deployment unit.
# Run from this directory after copying .env.example to .env.
# Redis is intentionally shared with the existing CRM deployment (DB 6).
services:
  app:
    image: ghcr.io/activepieces/activepieces:${AP_VERSION:-0.90.4}
    container_name: crmwolf-activepieces-app
    restart: unless-stopped
    ports:
      - "${ACTIVEPIECES_BIND_ADDRESS:-127.0.0.1}:${ACTIVEPIECES_PORT:-8080}:80"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AP_CONTAINER_TYPE: APP
    volumes:
      - activepieces_cache:/usr/src/app/cache
    networks:
      - crmwolf-activepieces
      - crmwolf-network

  worker:
    image: ghcr.io/activepieces/activepieces:${AP_VERSION:-0.90.4}
    container_name: crmwolf-activepieces-worker
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    env_file:
      - .env
    environment:
      AP_CONTAINER_TYPE: WORKER
      # Worker runs in its own container; it must resolve the App by service name.
      AP_FRONTEND_URL: http://app
    volumes:
      - activepieces_cache:/usr/src/app/cache
    networks:
      - crmwolf-activepieces
      - crmwolf-network

  postgres:
    image: pgvector/pgvector:0.8.0-pg14
    container_name: crmwolf-activepieces-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AP_POSTGRES_DATABASE:-activepieces}
      POSTGRES_USER: ${AP_POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD:?AP_POSTGRES_PASSWORD must be set in .env}
    volumes:
      - activepieces_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AP_POSTGRES_USERNAME:-postgres} -d ${AP_POSTGRES_DATABASE:-activepieces}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crmwolf-activepieces

volumes:
  activepieces_cache:
  activepieces_postgres_data:

networks:
  crmwolf-activepieces:
    name: crmwolf-activepieces
  # Existing CRM deployment provides this external network and redis6 service.
  crmwolf-network:
    external: true
    name: crmwolf-network
