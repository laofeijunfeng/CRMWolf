# docker-compose.yml - 服务器部署基础服务定义
# 由 CRM-Docs/deployment/deploy.sh 上传，并配合 docker-compose.server.yml 使用。

name: crmwolf

services:
  backend:
    image: crm-backend:${IMAGE_TAG:-amd64}
    container_name: crm-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_PORT: 3306
      REDIS_PORT: 6379
      REDIS_DB: 5
      QDRANT_ENABLED: ${QDRANT_ENABLED:-true}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_COLLECTION_CUSTOMER_EVIDENCE: ${QDRANT_COLLECTION_CUSTOMER_EVIDENCE:-crm_customer_evidence}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-1024}
      CUSTOMER_EVIDENCE_EMBEDDING_MODEL: ${CUSTOMER_EVIDENCE_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      CUSTOMER_EVIDENCE_EMBEDDING_DIMENSIONS: ${CUSTOMER_EVIDENCE_EMBEDDING_DIMENSIONS:-1024}
      CUSTOMER_EVIDENCE_EMBEDDING_DIMENSION: ${CUSTOMER_EVIDENCE_EMBEDDING_DIMENSION:-1024}
      CUSTOMER_EVIDENCE_EMBEDDING_API_HOST: ${CUSTOMER_EVIDENCE_EMBEDDING_API_HOST:-https://api.siliconflow.cn/v1}
      CUSTOMER_EVIDENCE_EMBEDDING_BASE_URL: ${CUSTOMER_EVIDENCE_EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      CUSTOMER_EVIDENCE_EMBEDDING_API_KEY: ${CUSTOMER_EVIDENCE_EMBEDDING_API_KEY:-}
      CUSTOMER_EVIDENCE_EMBEDDING_API_KEY_FILE: ${CUSTOMER_EVIDENCE_EMBEDDING_API_KEY_FILE:-}
      CUSTOMER_EVIDENCE_SYNC_ENABLED: ${CUSTOMER_EVIDENCE_SYNC_ENABLED:-true}
      CUSTOMER_EVIDENCE_SYNC_BATCH_SIZE: ${CUSTOMER_EVIDENCE_SYNC_BATCH_SIZE:-10}
      CUSTOMER_EVIDENCE_SYNC_INTERVAL_SECONDS: ${CUSTOMER_EVIDENCE_SYNC_INTERVAL_SECONDS:-300}
      AI_GENERATION_CONCURRENCY: ${AI_GENERATION_CONCURRENCY:-1}
      CUSTOMER_INTELLIGENCE_RETRY_BATCH_SIZE: ${CUSTOMER_INTELLIGENCE_RETRY_BATCH_SIZE:-1}
      CUSTOMER_INTELLIGENCE_RETRY_INTERVAL_SECONDS: ${CUSTOMER_INTELLIGENCE_RETRY_INTERVAL_SECONDS:-300}
      CUSTOMER_INTELLIGENCE_BACKFILL_BATCH_SIZE: ${CUSTOMER_INTELLIGENCE_BACKFILL_BATCH_SIZE:-1}
      CUSTOMER_INTELLIGENCE_BACKFILL_INTERVAL_SECONDS: ${CUSTOMER_INTELLIGENCE_BACKFILL_INTERVAL_SECONDS:-900}
      CRM_DEBUG: ${CRM_DEBUG:-false}
    volumes:
      - backend_logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: crm-qdrant-dev
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  frontend:
    image: crm-frontend:${IMAGE_TAG:-amd64}
    container_name: crm-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_logs:
    driver: local
  qdrant_data:
    name: crm-qdrant-dev-data
    driver: local

networks:
  default:
    name: crm-dev-network
